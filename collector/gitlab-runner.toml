# Source of truth for /etc/gitlab-runner/config.toml on the gitlab LXC.
#
# This file is NOT deployed verbatim: the four `token` values are placeholders
# here and real runner tokens must be pasted in from GitLab before use. That is
# the only difference -- everything else is what runs.
#
# ONE LINE IS MANAGED AT RUNTIME: `concurrent`. ci-admission.sh rewrites it and
# SIGHUPs the runner when measured memory crosses a threshold, so the value here is
# the MAXIMUM, not necessarily what is live. Reading `concurrent` off this file while
# debugging is therefore a mistake -- read it off the box, or read the ci-admission
# log. Everything else in this file is static.
#
# The per-runner `limit`s are deliberately NOT the constraint: each is set to what
# that tier alone could fill (cores / per-slot CPU, memory / per-slot GiB), so any one
# tier can use the whole host when it is the only one with work. `concurrent` above
# them is the single governor.
#
# Why it lives in git: the deployed config had drifted from every copy of it, and
# carried `request_concurrency` at the top level, which is not a valid key there.
# `gitlab-runner lint` rejected the whole file over it and the runner silently
# ignored the setting. Nothing caught either problem because nothing had a copy.
#
# Validate any edit before reloading it on the box:
#
#   gitlab-runner lint --config collector/gitlab-runner.toml
#   pct exec <gitlab-vmid> -- gitlab-runner lint --config /etc/gitlab-runner/config.toml
#
# Then reload, which is graceful and does not disturb running jobs:
#
#   pct exec <gitlab-vmid> -- systemctl reload gitlab-runner
#
# Managed by the homelab CI migration. One pool per line of work, all on the
# same native x86-64 Docker daemon so image layers and volumes are shared.
#
# The pools add up to the host exactly: 0.5x2 + 1x1 + 2x2 + 3x2 = 12 CPUs and
# 2+2+8+12 = 24 GiB, and `concurrent` equals their sum. A job's slot is a hard
# cgroup cap, so that sum is the host's ceiling, not an oversubscription.
#
# /srv/mise and /srv/builds are real host paths. A bare "/mise" is an anonymous
# volume: every job would start with an empty tool cache and an empty checkout,
# so `mise install` re-downloads the toolchain for every job. Keep the two paths
# absolute and separated by a colon.
#
# /srv/tmpfs is a bounded tmpfs (6 GiB, mode 1777) mounted into every job as
# /tmp/adea-test. A job opts in with ADEA_TMPFS_TMPDIR=1 and puts its TMPDIR there;
# base.yml guards it with a writable-directory check, so it is a no-op where the
# path is absent. Without it the opt-in never fired on this host, and the dirs that
# write temporary SQLite databases paid the builds volume for it: measured here at
# 11 ms per fsync against 0.41 ms on tmpfs, 27x. control-plane:unit is the clearest
# case -- 582 s of wall clock using 0.55 of its 2 CPU cores, so latency-bound, not
# compute-bound. Bound the size: this host has no swap, and the cap turns a runaway
# job into its own ENOSPC instead of an OOM for the whole runner.
#
# shm_size is a count of bytes, and it is /dev/shm for a Chromium in the job.
# The 64 MiB default is far below what Playwright needs.
concurrent = 12
# request_concurrency is a per-runner key, not a top-level one. Set here it was
# rejected by `gitlab-runner lint` as an unknown key and silently ignored; each
# [[runners]] block below carries its own.
# request_concurrency = 2
check_interval = 3
log_level = "info"

[session_server]
  session_timeout = 1800

[[runners]]
  name = "linux tiny (MS-A2: Docker)"
  url = "https://gitlab.com"
  token = "<RUNNER_TOKEN_FROM_GITLAB>"
  executor = "docker"
  environment = ["ADEA_RUNNER_PLATFORM=linux/amd64"]
  limit = 24
  request_concurrency = 4
  output_limit = 8192
  [runners.docker]
    image = "ubuntu:24.04"
    privileged = false
    cpus = "0.5"
    memory = "1g"
    pull_policy = ["if-not-present"]
    extra_hosts = ["host.docker.internal:host-gateway"]
    volumes = ["/srv/mise:/mise", "/srv/builds:/builds", "/srv/tmpfs:/tmp/adea-test"]
    shm_size = 0
    tls_verify = false

[[runners]]
  name = "linux small (MS-A2: Docker)"
  url = "https://gitlab.com"
  token = "<RUNNER_TOKEN_FROM_GITLAB>"
  executor = "docker"
  environment = ["ADEA_RUNNER_PLATFORM=linux/amd64"]
  limit = 12
  request_concurrency = 4
  output_limit = 8192
  [runners.docker]
    image = "ubuntu:24.04"
    privileged = false
    cpus = "1"
    memory = "2g"
    pull_policy = ["if-not-present"]
    extra_hosts = ["host.docker.internal:host-gateway"]
    volumes = ["/srv/mise:/mise", "/srv/builds:/builds", "/srv/tmpfs:/tmp/adea-test"]
    shm_size = 268435456
    tls_verify = false

