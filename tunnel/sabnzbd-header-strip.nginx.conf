# SABnzbd returns "External internet access denied" for any request whose
# X-Forwarded-For is a public address. That header is added by Cloudflare and
# re-added by cloudflared when it connects to the origin, so a Cloudflare
# Transform Rule cannot remove it — the transform phase runs before the
# connector writes the header.
#
# The only place left to drop it is between cloudflared and the app, which is
# what this does. Deploy on the host running the tunnel connector:
#
#   apt-get install -y nginx-light
#   cp sabnzbd-header-strip.nginx.conf /etc/nginx/sites-available/sabnzbd
#   ln -sf /etc/nginx/sites-available/sabnzbd /etc/nginx/sites-enabled/sabnzbd
#   nginx -t && systemctl reload nginx
#
# then point the tunnel ingress for sabnzbd at it:
#
#   "origin": "http://127.0.0.1:9099"
#
# Note this only defeats SABnzbd's external-access guard; Cloudflare Access
# still gates the hostname before anything reaches the connector.

server {
    listen 127.0.0.1:9099;
    client_max_body_size 0;

    location / {
        # Example address — replace with the SABnzbd host as the connector sees it.
        proxy_pass http://10.0.0.21:8282;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";

        # SABnzbd pushes live updates over websockets.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;

        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
